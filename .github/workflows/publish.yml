name: Publish

on:
  push:
    tags:
      - v*

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm-publish

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Run high-severity audit
        run: pnpm audit --audit-level high

      - name: Build package
        run: pnpm build

      - name: Verify package metadata
        run: pnpm exec publint

      - name: Verify package contents
        run: |
          TAG_ARG=$(node -p "require('./package.json').version.includes('-') ? '--tag oidc-test' : ''")
          npm publish --dry-run $TAG_ARG

      - name: Publish package
        run: |
          TAG_ARG=$(node -p "require('./package.json').version.includes('-') ? '--tag oidc-test' : ''")
          npm publish $TAG_ARG
